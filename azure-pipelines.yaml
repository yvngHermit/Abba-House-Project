
trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      php --version
    displayName: 'Display PHP version'

  - bash: |
      set -e

      while IFS= read -r -d '' file; do
        echo "Checking: $file"
        php -l "$file"
      done < <(find . \
        -type d \( -name .git -o -name .github -o -name vendor \) -prune -o \
        -type f -name '*.php' -print0)
    displayName: 'Validate PHP syntax'